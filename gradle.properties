org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# whisper.cpp release fetched by CMake at build time.
whisper.version=v1.7.5
# Set to true to build whisper.cpp with the Vulkan GPU backend (experimental, see README).
whisper.vulkan=false
# Optional: path to a local whisper.cpp checkout (for offline builds).
# whisper.sourceDir=/path/to/whisper.cpp
