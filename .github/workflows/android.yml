name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; just add the NDK and CMake we pin.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AI-Meeting-Recorder.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-Meeting-Recorder-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: airecord-apks
          path: dist/*.apk

      # Publish a direct download link: Releases -> "latest-build" -> AI-Meeting-Recorder.apk
      - name: Publish to GitHub Release (latest-build)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/*.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "최신 빌드 (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "자동 빌드된 APK입니다. 휴대폰에서 AI-Meeting-Recorder.apk 를 내려받아 설치하세요 (출처를 알 수 없는 앱 설치 허용 필요). 빌드 시각: $(date -u '+%Y-%m-%d %H:%M UTC')"
